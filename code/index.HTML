<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="head">
            <h1>Rock Paper Sicssors</h1>
        </div>
    </header>
    <div class="images">
        <div class="images2" id="rock"><img src="./images/rock.png" alt="rock"></div>
        <div class="images2" id="paper"><img src="./images/paper.png" alt="paper"></div>
        <div class="images2" id="scissors"><img src="./images/scissors.png" alt="scissors"></div>
    </div>
    <div class="score-board">
            <div class="score">
                <p id="user-score">0</p>
                <p>You</p>
            </div>
            <div class="score">
                <p id="com-score">0</p>
                <p>Computer</p>
            </div>
            </div>
        
        <div class="message">
                <p id="msg">Play your move!</p>
        </div>
        <div class="output">
            <p id="result">Your choice and Computer's choice will show here.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
